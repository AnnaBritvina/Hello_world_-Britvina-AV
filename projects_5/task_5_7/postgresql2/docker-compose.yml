services:

  db:

    image: postgres:15

    container_name: postgres_student2

    ports:

      - "5434:5432"

    environment:

      POSTGRES_USER: postgres_student

      POSTGRES_PASSWORD: student

      POSTGRES_DB: student

    volumes:

      - db_data:/var/lib/postgresql2/data

    restart: unless-stopped



volumes:

  db_data: